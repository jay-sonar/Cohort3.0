<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squid Game Landing Page</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

  <div id="main">

    <nav>
      <div class="logo">SQUID<br>GAME</div>

      <div class="links">
        <a href="#">About</a>
        <a class="active" href="#">Watch now</a>
        <a href="#">Actors</a>
        <a href="#">Contact</a>
      </div>

      <i class="ri-menu-3-line menu"></i>
    </nav>

    <section id="hero">

      <div class="left-content">
        <h1>
          SQUID <br>
          GAME
        </h1>

        <div class="shape yellow"></div>
        <div class="shape blue"></div>

        <p>
          Action / Thriller / Drama Series directed by Dong-hyuk Hwang <br>
          Season 1: 9 Episodes
        </p>

        <div class="buttons">
          <button class="play">
            <i class="ri-play-fill"></i>
            Play Now
          </button>

          <button class="trailer">
            <i class="ri-play-mini-line"></i>
            Watch Trailer
          </button>
        </div>
      </div>

      <div class="scroll">
        <span>SCROLL</span>
        <div></div>
      </div>

      <div class="social">
        <i class="ri-twitter-line"></i>
        <i class="ri-instagram-line"></i>
        <i class="ri-facebook-fill"></i>
      </div>

      <h2 class="bg-text left-bg">GAME</h2>
      <h2 class="bg-text right-bg">SQUID</h2>

      <img class="main-img" src="./aaaa-Photoroom.png" alt="Squid Game Character">

      <div class="cards">
        <div class="card">
          <img src="./1.jpeg" alt="">
          <button><i class="ri-play-fill"></i></button>
        </div>

        <div class="card">
          <img src="./2.jpeg" alt="">
          <button><i class="ri-play-fill"></i></button>
        </div>

        <div class="card">
          <img src="./3.jpeg" alt="">
          <button><i class="ri-play-fill"></i></button>
        </div>
      </div>

    </section>

  </div>

</body>
</html>
